<body>

  <!-- 顶部导航：仍然保留原来的四个入口 -->

    <nav class="nav-shell" aria-label="Main navigation">

      <a class="brand" href="index.html">

  <!-- 【新增】独立的 Useless Machine 页面 -->
  <main class="page-width machine-page">
    <section class="useless-section" aria-labelledby="useless-title">

      <h2 id="useless-title">Useless Machine</h2>

      <div class="useless-machine" id="useless-machine">

        <div class="machine-stage">

          <!-- 紫色开关 -->
          <div class="machine-switch-area">

            <button
              class="machine-switch"
              id="useless-switch"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="Turn on the useless machine"
            >
              <span class="switch-track">
                <span class="switch-knob"></span>
              </span>
            </button>

            <span
              class="switch-state"
              id="useless-state"
              aria-live="polite"
            >OFF</span>

          </div>

          <!-- Q版金毛 -->
          <div class="retriever" id="golden-retriever">

            <svg
              class="retriever-svg"
              viewBox="0 0 280 220"
              role="img"
              aria-label="A cute cartoon golden retriever"
              xmlns="http://www.w3.org/2000/svg"
            >

              <!-- 灏惧反 -->
              <path
                class="dog-tail"
                d="M 201 132 Q 235 127 226 101"
                fill="none"
                stroke="#CE8E3C"
                stroke-width="16"
                stroke-linecap="round"
              />

              <!-- 韬綋 -->
              <ellipse
                cx="157" cy="145"
                rx="67" ry="39"
                fill="#EAB35D"
                stroke="#C88A3D"
                stroke-width="2.5"
              />

              <!-- 鍚庤吙 -->
              <ellipse cx="117" cy="166" rx="17" ry="26" fill="#DDA04C"/>
              <ellipse cx="116" cy="185" rx="20" ry="10" fill="#F6D18B"/>

              <ellipse cx="194" cy="164" rx="16" ry="25" fill="#DDA04C"/>
              <ellipse cx="195" cy="184" rx="19" ry="10" fill="#F6D18B"/>

              <!-- 鍓嶈吙 -->
              <path
                d="M 165 151 Q 164 172 169 183"
                fill="none"
                stroke="#C88A3D"
                stroke-width="21"
                stroke-linecap="round"
              />

              <ellipse cx="170" cy="185" rx="19" ry="10" fill="#F6D18B"/>

              <!-- 浼稿悜寮€鍏崇殑鐖瓙 -->
              <g class="dog-paw">

                <path
                  d="M 116 119 Q 104 129 94 141 L 78 150"
                  fill="none"
                  stroke="#DDA04C"
                  stroke-width="23"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <ellipse
                  cx="75" cy="152"
                  rx="20" ry="14"
                  fill="#F6D18B"
                  stroke="#D5A052"
                  stroke-width="2"
                />

                <path
                  d="M 64 151 Q 66 157 70 159
                     M 76 153 Q 78 158 81 159"
                  fill="none"
                  stroke="#D5A052"
                  stroke-width="2"
                  stroke-linecap="round"
                />

              </g>

              <!-- 鑰虫湹 -->
              <ellipse
                cx="108" cy="69"
                rx="17" ry="29"
                fill="#C78339"
                transform="rotate(35 108 69)"
              />

              <ellipse
                cx="177" cy="69"
                rx="17" ry="29"
                fill="#C78339"
                transform="rotate(-35 177 69)"
              />

              <!-- 鑴?-->
              <ellipse
                cx="143" cy="75"
                rx="43" ry="39"
                fill="#F6CF82"
                stroke="#D39A4B"
                stroke-width="2.5"
              />

              <!-- 鐪夋瘺 -->
              <path
                d="M 119 59 Q 128 54 135 59
                   M 153 59 Q 161 54 168 59"
                fill="none"
                stroke="#A86C32"
                stroke-width="2.5"
                stroke-linecap="round"
              />

              <!-- 鐪肩潧 -->
              <ellipse cx="128" cy="68" rx="4.5" ry="6" fill="#392B24"/>
              <ellipse cx="160" cy="68" rx="4.5" ry="6" fill="#392B24"/>

              <circle cx="129.5" cy="66" r="1.5" fill="#FFFFFF"/>
              <circle cx="161.5" cy="66" r="1.5" fill="#FFFFFF"/>

              <!-- 鍢村反 -->
              <ellipse cx="144" cy="87" rx="23" ry="16" fill="#FFE7B0"/>
              <ellipse cx="144" cy="82" rx="7" ry="5" fill="#392B24"/>

              <path
                d="M 144 87 Q 143 96 135 96
                   M 144 87 Q 145 96 153 96"
                fill="none"
                stroke="#80502F"
                stroke-width="2"
                stroke-linecap="round"
              />

              <path
                d="M 136 100 Q 144 106 152 100"
                fill="none"
                stroke="#A85E4A"
                stroke-width="3"
                stroke-linecap="round"
              />

              <!-- 鑴搁 -->
              <ellipse cx="115" cy="83" rx="8" ry="5" fill="#EEA08B" opacity=".7"/>
              <ellipse cx="173" cy="83" rx="8" ry="5" fill="#EEA08B" opacity=".7"/>

              <!-- 澶撮《鐨勫皬姣涘彂 -->
              <path
                d="M 130 39 Q 135 29 140 38 Q 146 25 151 39"
                fill="#EAB35D"
                stroke="#C88A3D"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

            </svg>

          </div>
        </div>
      </div>
    </section>
  </main>

  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch((error) => console.error("Service worker registration failed:", error))); }</script>
